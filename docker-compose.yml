services:
  app:
    image: node:20-bookworm-slim
    container_name: capstone-app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    env_file:
      - .env
    command: npm run dev
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: capstone-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: web_app
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  mysql_data:
    name: devcontainer_mysql-data
